apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: gitops-web
  template:
    metadata:
      labels:
        app: gitops-web
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
